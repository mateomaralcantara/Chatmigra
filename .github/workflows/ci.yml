name: ChatMi CI

on:
  push:
    branches:
      - main
      - fix/chatmi-10x
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chatmi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, harness and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: "Harness: guards"
        run: npm run test:guards

      - name: "Harness: unit"
        run: npm run test:unit

      - name: "Harness: contract"
        run: npm run test:contract

      - name: "Harness: db"
        run: npm run test:db

      - name: "Harness: flows"
        run: npm run test:flows

      - name: Production build
        run: npm run build

  e2e:
    name: "Harness: e2e (real browser, desktop + mobile)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
